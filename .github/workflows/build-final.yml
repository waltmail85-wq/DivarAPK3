PAYLOAD
          base64 -d /tmp/divar/project.b64 > /tmp/divar/project.zip
          rm -rf /tmp/divar/project
          mkdir -p /tmp/divar/project
          unzip -q /tmp/divar/project.zip -d /tmp/divar/project
          cp -a /tmp/divar/project/. "$GITHUB_WORKSPACE/"
          test -f "$GITHUB_WORKSPACE/settings.gradle"
          test -f "$GITHUB_WORKSPACE/build.gradle"
          test -f "$GITHUB_WORKSPACE/app/build.gradle"
          echo "Android project extracted successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivarPriceMeterPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
