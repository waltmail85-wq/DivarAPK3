name: Build DivarPriceMeterPro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Patch Divar link extractor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/divar/pricemeter/MainActivity.java')
          s = p.read_text()
          start = s.index('    void parseSearch(){')
          end = s.index('    String unquote(', start)
          new = r'''    void parseSearch(){String js="(function(){let out=new Set();document.querySelectorAll('[href]').forEach(x=>{let u=x.getAttribute('href')||x.href||'';if(u.includes('/v/')){try{u=new URL(u,location.href).href;}catch(e){}out.add(u.split('#')[0].split('?')[0]);}});let h=document.documentElement?document.documentElement.outerHTML:'';let re=/(?:https?:\\/\\/(?:www\\.)?divar\\.ir)?\\/v\\/[A-Za-z0-9_-]+/g,m;while((m=re.exec(h))!==null){let u=m[0].replace(/\\\\/g,'/');if(u.startsWith('/v/'))u='https://divar.ir'+u;out.add(u);}return JSON.stringify(Array.from(out).slice(0,60));})()";web.evaluateJavascript(js,val->{String s=unquote(val);Matcher m=Pattern.compile("(?:https?://(?:www\\.)?divar\\.ir)?/v/[A-Za-z0-9_-]+").matcher(s);while(m.find()&&links.size()<40){String u=m.group();if(u.startsWith("/v/"))u="https://divar.ir"+u;if(!links.contains(u))links.add(u);}if(links.isEmpty()){summary.setText("آگهی‌ها پیدا شدند ولی لینک جزئیات از صفحه خوانده نشد؛ در حال تلاش دوباره…");web.postDelayed(this::parseSearch,2500);return;}summary.setText("تعداد "+links.size()+" آگهی پیدا شد؛ دریافت جزئیات شروع شد…");running=true;processNext();});}
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivarPriceMeterPro-v6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
