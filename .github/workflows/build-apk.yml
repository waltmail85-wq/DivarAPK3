name: Build DivarPriceMeterPro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Generate signing key and sign APK
        run: |
          keytool -genkeypair -v -keystore release-keystore.jks -storepass buildpass -keypass buildpass -alias divar -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DivarPriceMeter, OU=App, O=DivarPriceMeter, L=Tabriz, ST=East Azerbaijan, C=IR"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks release-keystore.jks --ks-pass pass:buildpass --key-pass pass:buildpass --out app/build/outputs/apk/release/DivarPriceMeter-v5.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/DivarPriceMeter-v5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DivarPriceMeterPro-release-v5
          path: app/build/outputs/apk/release/DivarPriceMeter-v5.apk
          if-no-files-found: error
