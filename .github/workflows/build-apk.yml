name: Build DivarPriceMeterPro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Patch extractor and design
        run: python3 patch_divar.py

      - name: Fix virtualized listing collection
        run: python3 patch_count.py

      - name: Apply final app fixes
        run: python3 patch_final.py

      - name: Create temporary release signing key
        run: |
          PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 16)
          echo "RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore release-key.jks -storepass "$PASS" -keypass "$PASS" -alias divar -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Divar Price Meter, OU=App, O=Shahran, L=Tabriz, ST=East Azerbaijan, C=IR"

      - name: Build signed Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DivarPriceMeterPro-v13-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
